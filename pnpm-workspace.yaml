allowBuilds:
  core-js: false
  msw: false
  sharp: true
  unrs-resolver: true

# Versiones mínimas para dependencias que llegan a través de otros paquetes y
# que Dependabot no puede subir solo (su paquete padre fija una versión vieja).
# better-auth llega por @neondatabase/auth (beta fija); sus paquetes se publican
# juntos, así que se suben todos a la misma versión de parche.
overrides:
  zod@>=4.0.0 <4.6.6: ^4.6.6
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  better-auth@<1.7.7: 1.7.7
  '@better-auth/core@<1.7.7': 1.7.7
  '@better-auth/drizzle-adapter@<1.7.7': 1.7.7
  '@better-auth/kysely-adapter@<1.7.7': 1.7.7
  '@better-auth/memory-adapter@<1.7.7': 1.7.7
  '@better-auth/mongo-adapter@<1.7.7': 1.7.7
  '@better-auth/prisma-adapter@<1.7.7': 1.7.7
  '@better-auth/telemetry@<1.7.7': 1.7.7
  '@better-auth/oauth-provider@<1.7.7': 1.7.7
  '@better-auth/passkey@<1.7.7': 1.7.7
