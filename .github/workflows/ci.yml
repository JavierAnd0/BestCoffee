name: CI — PR Checks & E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Lint & Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      USE_MOCKS: "true"
      NEXT_PUBLIC_NEON_AUTH_URL: https://ep-flat-haze-acncceyy.neonauth.sa-east-1.aws.neon.tech/neondb/auth
      NEON_AUTH_BASE_URL: https://ep-flat-haze-acncceyy.neonauth.sa-east-1.aws.neon.tech/neondb/auth
      NEON_AUTH_COOKIE_SECRET: dev-neon-auth-cookie-secret-min-32-chars-long!
      AUTH_SECRET: dev-auth-secret-for-ci-tests-at-least-32-chars!

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 1. TypeScript Validation
        run: pnpm tsc --noEmit

      - name: 2. ESLint Check
        run: pnpm lint

      - name: 3. Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: 4. Run Smoke & E2E Tests
        run: pnpm test:e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

